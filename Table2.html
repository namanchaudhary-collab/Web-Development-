<!DOCTYPE html>
<html>
<head>
    <title>Student Data Table</title>
    <style>
        table, th, td {
            border: 1px solid black;
            border-collapse: collapse;
            padding: 8px 12px;
            text-align: left;
        }
    </style>
</head>
<body>

    <h3>Students Data</h3>
    <table>
        <tr>
            <th colspan="2">Student name</th>
            <th>G</th>
            <th>S</th>
        </tr>
        
        <tr>
            <td>Rohan</td>
            <td>Math</td>
            <td>A+</td>
            <td>Pass</td>
        </tr>
        
        <tr>
            <td>Priya</td>
            <td>Science</td>
            <td>A</td>
            <td>Pass</td>
        </tr>
        
        <tr>
            <td colspan="3">Total</td>
            <td>2</td>
        </tr>
    </table>

</body>
</html>
