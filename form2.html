<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form tag</title>
</head>
<body>
<form>
    <FORM ACTION="/SUBMIT" method="get">
    <label> Username: </label>
    <input type ="text" placeholder="Enter your username">

<br><br>
    <label>Password: </label>
    <input type = "password" placeholder="Enter your password">
<br><br>
    <label>Gender:</label> 
    <label for="1">Men</label>
    <input type="radio" id="1" name="gender" value="male">
    <label for="2">Female</label>
    <input type="radio" id="2" name="gender" value="Female">
<br><br>
    <label>Hobbies</label>
    <input type="checkbox" id="3" name="Hobbies" value="Sports">
    <label for="3">Sports</label>
    <input type="checkbox" id="4" name="Hobbies" value="Reading">
    <label for="4">Reading</label>
    <input type="checkbox" id="5" name="Hobbies" value="Art">
    <label for="5">Art</label>
<br><br>
    <select name="Course">
    <option value="B.Tech"> B.tech</option>
    <option value="MCA"> MCA</option>
    <option value="MBA"> MBA</option>
    <option value="B Pharma"> B Pharma</option>
    <option value="M.tech"> M.tech</option>
    </select>
<br><br>
    <textarea name="Comment" rows="4" cols="50" placeholder="Enter you comment..."></textarea>
<br><br>
    <button>Resgistration Done</button>
    <input type="Submit" value="Submit">
    </FORM>
<br><br>
</form>
<audio  controls autoplay loop muted preload="auto" src="audio.mp3"></audio>
<br>
<video controls autoplay autoplay loop muted height="350px" src="Video.mp4"></video>
<video controls height="350px" src="https://samplelib.com/mp4/sample-10s-h265.mp4"></video>
    
</body>
</html>
